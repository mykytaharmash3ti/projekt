    <main>
        <section>
            <nav>
                <button>Uczestnik</button>

            <section id="q">

                    <h2>Dane Klienta</h2>

                    <br>
                    <label for="Miejsce">Miejsce wylotu</label>
                    <select name="Miejsce" id="Miejsce" disabled>

                    </select>
                    <br>

                    <button>Sprawdź cenę</button>
